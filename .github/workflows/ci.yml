name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a source link that moves or a lab file that is renamed fails here
  # before a reader finds it.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.23"

jobs:
  checks:
    name: Decisions, evidence, cost model and links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Tests (cost arithmetic, generated sections, relative links)
        run: uv run pytest -q
      - name: Every decision's evidence and the decision tables match evidence.yml
        run: uv run python scripts/build.py --check
      - name: The cost tables match the model
        run: uv run python cost/model.py --check
      - name: Every source link resolves
        run: uv run python scripts/check_links.py
      - name: Audit the workflows (zizmor)
        run: uvx zizmor@1.30.1 --offline --persona=regular .github/workflows

  # The source and output contracts are valid Open Data Contract Standard documents, and
  # the producer-side check (0013) is seen to fail: the product contract with users.email
  # renamed (tests/fixtures) must be reported as breaking, and an unchanged copy must not.
  contracts:
    name: Data contracts, and the breaking-change check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATACONTRACT: datacontract-cli==1.2.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Every contract is valid ODCS
        run: |
          for f in models/contracts/*.odcs.yaml; do
            uvx --from "$DATACONTRACT" datacontract lint "$f"
          done
      - name: A renamed column is reported as breaking; an unchanged contract is not
        run: |
          original=models/contracts/product-database.odcs.yaml
          renamed=tests/fixtures/product-database-renamed-column.odcs.yaml
          if uvx --from "$DATACONTRACT" datacontract breaking "$original" "$renamed"; then
            echo "::error::renaming users.email to email_address was not reported as breaking"
            exit 1
          fi
          uvx --from "$DATACONTRACT" datacontract breaking "$original" "$original"
