# The company's scale (docs/01-brief.md) as the cost model reads it: today, and its growth
# plan at 12 and 36 months. Volumes are the brief's; the compute, scan and people figures
# are assumptions, to be replaced by what the platform PoC measures.
days_per_month: 30.4

# Stored bytes per event after columnar compression, and how long events are kept
# (25 months, the history the requirements ask for).
stored_bytes_per_event: 150
retention_days: 760
# Marts, snapshots and dimensions on top of the event history, as a share of it.
derived_storage_share: 0.3

# THE assumption the comparison rests on: what one hour of "medium" analytical compute
# is on each engine. Vendors do not publish a common unit, and nothing here measured
# one against another. Change these to test how much the answer depends on them.
medium_engine_hour:
  snowflake_warehouse: Medium        # 4 credits/hour
  databricks_sql_warehouse: Medium   # 24 DBU/hour, serverless
  trino_workers_r7i_2xlarge: 4       # plus an always-on coordinator

# People. The share of one engineer each option takes to run (sizing, upgrades,
# incidents, table maintenance), and what an engineer-month costs the company fully
# loaded. The largest assumption in the model, and the one the brief's team size makes
# decisive.
engineer_month_usd: 11_000
operations_fte:
  Snowflake Enterprise: 0.1
  Snowflake Business Critical: 0.1
  Databricks SQL Serverless: 0.15
  Trino on EC2: 1.0
  Athena: 0.25

tiers:
  today:
    events_per_day: 350_000
    compute_hours_per_day: 1.5   # the daily build plus analysts' queries, medium-engine hours
    scanned_tb_per_day: 0.01     # what per-scan engines bill: analysts plus transformation
  in_12_months:
    events_per_day: 1_000_000
    compute_hours_per_day: 3
    scanned_tb_per_day: 0.05
  in_36_months:
    events_per_day: 5_000_000
    compute_hours_per_day: 6
    scanned_tb_per_day: 0.25
