# Every figure the architecture cites, with the file it was measured in.
# Values and methods are the same as on basantbhattarai.com.np (_data/metrics.yml);
# scripts/build.py writes them into the decision records and EVIDENCE.md.

lakehouse_partition_prune:
  value: "88 ms"
  label: "one-month predicate over 1.5M Iceberg rows"
  method: "median of 7 server-side runs from system.runtime.queries, after 2 warm-ups, on a month-partitioned Iceberg table"
  repo: lakehouse-lab
  file: MEASUREMENTS.md

lakehouse_compaction:
  value: "20 \u2192 1"
  label: "files merged per partition by optimize"
  method: "twenty 5,000-row inserts into one partition, then ALTER TABLE EXECUTE optimize, counted from the $files metadata table"
  repo: lakehouse-lab
  file: MEASUREMENTS.md

lakehouse_rollback:
  value: "909,968"
  label: "rows recovered by snapshot rollback"
  method: "an over-broad DELETE (a WHERE reaching years further back than intended), then ALTER TABLE EXECUTE rollback_to_snapshot, counted against the pre-incident total"
  repo: lakehouse-lab
  file: MEASUREMENTS.md

stream_failure_exactness:
  value: "9 of 9"
  label: "failure runs with every event layer exact"
  method: "three controller-broker kills, three TaskManager kills and three 150 s stalls under load; Kafka, ClickHouse, Iceberg and the dead-letter topic reconciled against the generator's ledger by sequence number"
  repo: streaming-platform
  file: MEASUREMENTS.md

stream_window_undercount:
  value: "59.8%"
  label: "of on-time events left in the window counts after one broker kill"
  method: "118,229 of 197,749 on-time events counted in their 10 s windows in the worst of three broker-kill runs; the rest went to the late side output because catch-up reordered partitions past the 5 s watermark bound"
  repo: streaming-platform
  file: MEASUREMENTS.md

stream_freshness_p99:
  value: "6.1 s"
  label: "p99 from event time to queryable in ClickHouse at 1,000 events/s"
  method: "ClickHouse ingest time minus event time for every on-time event, median of three 90 s runs; the floor is the 5 s checkpoint interval at which Flink's transactions commit"
  repo: streaming-platform
  file: MEASUREMENTS.md

registry_false_negatives:
  value: "0"
  label: "breaking schema changes passed as safe, in any mode"
  method: "51 hand-labelled JSON Schema changes, each scored under BACKWARD, FORWARD and FULL; every label cross-checked by an oracle that ran 8,092 generated probe documents through a real JSON Schema validator"
  repo: dataset-registry
  file: MEASUREMENTS.md

registry_false_alarms:
  value: "2 of 51"
  label: "changes flagged as breaking that are safe, per direction"
  method: "the same 51 cases; a widened and a narrowed regular expression, an added anyOf branch and an added multipleOf are flagged in both directions by design, and each truly breaks only one"
  repo: dataset-registry
  file: MEASUREMENTS.md

dsl_type1_misattributed:
  value: "15.1%"
  label: "of a year's revenue on the wrong plan with a Type 1 account dimension"
  method: "5,048 synthetic invoices (seed 7, Oct 2025 \u2013 Sep 2026) attributed by each account's current plan and compared with the plan the generator billed; $152,227 of $1,010,202"
  repo: data-stack-lab
  file: MEASUREMENTS.md

dsl_type2_correct:
  value: "5,048 of 5,048"
  label: "invoices on the plan they billed, Type 2 dimension from dbt snapshots"
  method: "as-of join of each invoice to the dim_account version in effect at billing, scored against the generator's truth file; the dimension was built from 13 monthly snapshot loads"
  repo: data-stack-lab
  file: MEASUREMENTS.md

dsl_snapshot_coverage:
  value: "533 of 570"
  label: "account changes in a year seen by monthly snapshots"
  method: "a change counts as seen if a snapshot version starts at its exact updated_at; signups excluded"
  repo: data-stack-lab
  file: MEASUREMENTS.md

dsl_mutants:
  value: "4 of 4"
  label: "deliberate model breaks that failed the build"
  method: "each break applied to a copy of the dbt project and built twice, with unit tests and with data tests only; recorded per engine and checked in CI"
  repo: data-stack-lab
  file: MEASUREMENTS.md

dsl_backwards_loss:
  value: "96.56%"
  label: "of a month's events lost by high-water-mark loads backfilled newest day first, every run green"
  method: "September 2026 backfilled through an Airflow 3.3 DAG, one run a day from the 30th back to the 1st; event-time and arrival-time watermark models scored against the 89,508 events that arrived"
  repo: data-stack-lab
  file: MEASUREMENTS.md

dsl_default_daily_loaded:
  value: "0 of 89,508"
  label: "events loaded by a data-interval incremental model on Airflow 3's default @daily, in 30 successful runs"
  method: "the same DAG on schedule \"@daily\", which Airflow 3.3 turns into a CronTriggerTimetable (create_cron_data_intervals = False); each run's data interval starts and ends at the instant it fires"
  repo: data-stack-lab
  file: MEASUREMENTS.md

dsl_quality_block:
  value: "0 of 3,198"
  label: "bad rows promoted when any failing data-quality check held the day"
  method: "September delivered daily with nine injected defects and checked in dbt (contract, row tests, batch tests against seven accepted days, manifest control totals); every delivered row labelled good or bad by its defect"
  repo: data-stack-lab
  file: MEASUREMENTS.md

dsl_spark_static_overwrite:
  value: "1 of 365"
  label: "daily partitions left after re-running one day with Spark's default static overwrite"
  method: "PySpark 4.2.0, a 365-day rollup written with partitionBy(activity_date); one day recomputed and written back with mode(\"overwrite\"); dynamic partitionOverwriteMode kept all 365"
  repo: data-stack-lab
  file: MEASUREMENTS.md

dsl_volume_band_published:
  value: "1,040"
  label: "events withheld when 27 September was promoted, the shortfall inside the accepted 30% volume band"
  method: "the day-level check compared 27 September's event count with recent accepted days; the shortfall sat inside the accepted 30% band, so the block policy promoted the day instead of holding it"
  repo: data-stack-lab
  file: MEASUREMENTS.md
  check: sibling

dsl_databricks_corrected_missed:
  value: "1,638"
  label: "events never loaded by COPY INTO and Auto Loader after a truncated file was corrected under the same name"
  method: "Databricks Free Edition (Databricks SQL 2026.39): ten days of event files (29,095 events) delivered into a Unity Catalog volume and loaded six ways after each delivery; the counts matched a prediction made from the documented semantics"
  repo: data-stack-lab
  file: MEASUREMENTS.md

dsl_delta_restore:
  value: "365 of 365"
  label: "days back after RESTORE TABLE, following an INSERT OVERWRITE of one day that left 1"
  method: "Databricks SQL 2026.39 on Free Edition: a 365-day rollup (333,082 rows) as a Delta table partitioned by day; 15 September rewritten with INSERT OVERWRITE, then RESTORE TABLE TO VERSION AS OF 0"
  repo: data-stack-lab
  file: MEASUREMENTS.md

baseline_bi_on_primary:
  value: "93 → 794 ms"
  label: "product p95 request latency, without and with the BI tool's reports on the primary"
  method: "a lab copy of the client's database (Postgres 17, 2 vCPU and 4 GB, 31.5 million events); the product's request at 100 a second from pgbench; two analysts running the four BI queries in turn; five minutes per scenario after a checkpoint. Requests over 100 ms went from 4.8% to 23.0%"
  repo: data-platform-architecture
  file: results/baseline.json

baseline_replica_long_reports:
  value: "3 of 412"
  label: "runs of the three long reports that finished on the read replica in five minutes; 409 were cancelled by recovery conflicts"
  method: "the same lab, reports on a streaming replica with the default max_standby_streaming_delay of 30 s and hot_standby_feedback off, while the product updated users at 100 requests a second; analysts retried at once"
  repo: data-platform-architecture
  file: results/baseline.json

baseline_replica_feedback:
  value: "20 of 20"
  label: "runs of the long reports that finished on the replica with hot_standby_feedback on"
  method: "the same lab and load; the cost, cleanup on the primary held back for as long as the longest report, was not visible in a five-minute window with reports of one to two minutes"
  repo: data-platform-architecture
  file: results/baseline.json

dpa_tag_masking:
  value: "3 of 3"
  label: "personal columns masked by one policy on the classification tag, including a column on a table created after the policy"
  method: "Databricks SQL 2026.39 on Free Edition: a governed tag `class`; the product contract's four tables created and all 26 columns tagged from the contract; one schema-level column-mask policy matching has_tag_value('class', 'personal'); every non-personal column stayed readable"
  repo: data-platform-architecture
  file: results/poc-databricks.json

dpa_row_filter_identity:
  value: "1 of 5"
  label: "accounts visible through a row filter keyed to the caller's identity"
  method: "a row filter on account_id that admits the accounts mapped to current_user() in a mapping table; moving the mapping moved the scope to the other account"
  repo: data-platform-architecture
  file: results/poc-databricks.json

dpa_session_variable_filter:
  value: "UNRESOLVED_COLUMN"
  label: "what Databricks returns for a row filter function that reads a session variable: a per-request value cannot scope rows"
  method: "DECLARE VARIABLE request_account, then CREATE FUNCTION … RETURN account_id = request_account, on Databricks SQL 2026.39"
  repo: data-platform-architecture
  file: results/poc-databricks.json

dsl_dbt_databricks:
  value: "11, 46, 3"
  label: "models, data tests and unit tests that passed when the dbt project was built on Databricks after one change, with revenue figures identical to DuckDB's"
  method: "dbt-databricks 1.12.7 on Databricks SQL 2026.39: the 13 monthly extracts replayed through dbt snapshot, then dbt build; measure.py's revenue questions asked of the Databricks marts with the same SQL. The one change: contract types varchar became string, because Databricks refuses VARCHAR without a length"
  repo: data-stack-lab
  file: results/dbt-databricks.json

dpa_erasure_time_travel:
  value: "100 of 100"
  label: "rows of an erased user still returned by time travel after DELETE and after REORG … APPLY (PURGE)"
  method: "Databricks SQL 2026.39 on Free Edition: a Delta table with deletion vectors; DELETE wrote 8 deletion vectors and rewrote 0 files; REORG APPLY (PURGE) rewrote 8 files; VERSION AS OF the version before the delete still returned every row, also after VACUUM at the default 7-day retention"
  repo: data-platform-architecture
  file: results/poc-databricks.json

dpa_erasure_after_retention:
  value: "refused"
  label: "time travel to the version before the delete, once the table's deleted-file retention had passed and VACUUM had run"
  method: "the table's delta.deletedFileRetentionDuration set to 1 hour for the test, VACUUM run after it passed; Databricks answered DELTA_UNSUPPORTED_TIME_TRAVEL_BEYOND_DELETED_FILE_RETENTION_DURATION. VACUUM RETAIN 0 HOURS was refused (DELTA_VACUUM_RETENTION_PERIOD_TOO_SHORT)"
  repo: data-platform-architecture
  file: results/poc-databricks.json
