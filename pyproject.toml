[project]
name = "data-platform-architecture"
version = "0.2.0"
description = "A data architecture engagement for a fictional SaaS company leaving Postgres: current state measured, options, target, decisions with evidence."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Basant Bhattarai" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]
# The current-state measurement only (baseline/): `uv sync --group baseline`. Needs Docker.
baseline = ["psycopg[binary]==3.3.6"]

[tool.uv]
package = false
exclude-newer = "3 days"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
